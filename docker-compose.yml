version: '3.8'
services:
  app:
    build: .
    image: verbena-app:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=5000
    ports:
      - "5000:5000"
    volumes:
      - ./uploads:/app/backend/uploads
      - ./logs:/var/log/verbena
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    depends_on:
      - nginx
  nginx:
    image: nginx:stable-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./uploads:/app/backend/uploads:ro
      - ./logs:/var/log/verbena:ro
    depends_on:
      - app
    restart: unless-stopped

volumes:
  uploads_data:
  logs_data:
